# Local test environment for the four demos. Throwaway credentials, local only.
#   docker compose up --build      ->  http://localhost:8081 ... :8084
#   docker compose down -v         ->  wipes the database (fresh demo data next time)
name: daw-demos

x-php-app: &php-app
  build:
    context: .
    dockerfile: Dockerfile.php
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: local-root-password
      MARIADB_USER: demo
      MARIADB_PASSWORD: local-demo-password
    volumes:
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
      - ../Projects/EventFlow/db/demo.sql:/sql/eventflow.sql:ro
      - ../Projects/ProyectoPasteleria/db/demo.sql:/sql/dulce-encanto.sql:ro
      - "../Projects/Examen 3º evaluación/db/demo.sql:/sql/malaga-supercars.sql:ro"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40

  eventflow:
    <<: *php-app
    ports: ["8081:80"]
    volumes: ["../Projects/EventFlow:/var/www/html"]
    environment: &db-env
      DB_HOST: db
      DB_USER: demo
      DB_PASS: local-demo-password
      DB_NAME: eventflow

  dulce-encanto:
    <<: *php-app
    ports: ["8082:80"]
    volumes: ["../Projects/ProyectoPasteleria:/var/www/html"]
    environment:
      <<: *db-env
      DB_NAME: dulceencanto

  malaga-supercars:
    <<: *php-app
    ports: ["8083:80"]
    volumes: ["../Projects/Examen 3º evaluación:/var/www/html"]
    environment:
      <<: *db-env
      DB_NAME: malagasupercars

  happy-paws:
    build:
      context: .
      dockerfile: Dockerfile.php
    ports: ["8084:80"]
    volumes: ["../Projects/HappyPaws:/var/www/html"]
