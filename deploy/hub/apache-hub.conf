# Keep memory small: the free instance has ~512 MB shared with MariaDB.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
KeepAliveTimeout 3
LimitRequestBody 2097152

<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         1
    MaxSpareServers         3
    MaxRequestWorkers       12
    MaxConnectionsPerChild  500
</IfModule>

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Every app shares this one domain, and they all use the same session key ($_SESSION['id_usuario']).
# Give each its own session cookie (own name, limited to its own URL path) so a login in one app
# can never authenticate you in another.
<Directory /var/www/html/eventflow>
    php_value session.name          EVENTFLOWSESS
    php_value session.cookie_path   /eventflow/
</Directory>
<Directory /var/www/html/dulce-encanto>
    php_value session.name          DULCEENCANTOSESS
    php_value session.cookie_path   /dulce-encanto/
</Directory>
<Directory /var/www/html/malaga-supercars>
    php_value session.name          MALAGASESS
    php_value session.cookie_path   /malaga-supercars/
</Directory>
