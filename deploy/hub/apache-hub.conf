# Keep memory small: the free instance has ~512 MB shared with MariaDB.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
KeepAliveTimeout 3
LimitRequestBody 2097152

<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         1
    MaxSpareServers         3
    MaxRequestWorkers       12
    MaxConnectionsPerChild  500
</IfModule>

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
